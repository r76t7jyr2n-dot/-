<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCKY ROULETTE</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .top-controls {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 10px;
    z-index: 20;
  }
  .icon-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #cbd5e1;
    height: 38px;
    padding: 0 14px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
  }
  #secret-btn {
    width: 38px;
    padding: 0;
    opacity: 0.22;
  }
  #secret-btn:hover {
    opacity: 0.85;
  }
  h1#title {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 900;
    letter-spacing: 0.12em;
    margin-bottom: 24px;
    background: linear-gradient(90deg, #fde047, #f59e0b, #fde047);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
    cursor: pointer;
    text-align: center;
  }
  .wheel-wrapper {
    position: relative;
    width: min(82vw, 400px);
    height: min(82vw, 400px);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }
  .pointer {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 34px solid #ef4444;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
    z-index: 10;
  }
  .pointer::after {
    content: "";
    position: absolute;
    top: -36px;
    left: -6px;
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
  }
  canvas#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 0 8px #334155, 0 0 0 12px #f59e0b, 0 20px 45px rgba(0, 0, 0, 0.65);
  }
  .center-cap {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    border: 4px solid #f59e0b;
    z-index: 5;
  }
  #spin-btn {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    color: #fff;
    border: none;
    padding: 16px 48px;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(217, 119, 6, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.3);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
  }
  #spin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(217, 119, 6, 0.6);
  }
  #spin-btn:active:not(:disabled) {
    transform: translateY(1px);
  }
  #spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Result Overlay */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.82);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-backdrop.active {
    display: flex;
  }
  .result-card {
    background: #1e293b;
    border: 2px solid #f59e0b;
    border-radius: 20px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .result-label {
    font-size: 0.95rem;
    color: #94a3b8;
    margin-bottom: 8px;
    letter-spacing: 0.1em;
  }
  .result-value {
    font-size: 2.4rem;
    font-weight: 900;
    color: #fde047;
    margin-bottom: 24px;
    word-break: break-word;
  }
  .btn-primary {
    background: #f59e0b;
    color: #0f172a;
    border: none;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
  }

  /* Admin Secret Modal */
  .admin-card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 24px;
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
  }
  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #1e293b;
  }
  .admin-header h2 {
    font-size: 1.2rem;
    color: #f8fafc;
  }
  .admin-note {
    font-size: 0.82rem;
    color: #94a3b8;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .item-row {
    display: grid;
    grid-template-columns: 36px 1fr 80px 70px 36px;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    background: #1e293b;
    padding: 8px 10px;
    border-radius: 10px;
  }
  .item-row input[type="color"] {
    width: 32px;
    height: 32px;
    border: none;
    background: none;
    cursor: pointer;
  }
  .item-row input[type="text"],
  .item-row input[type="number"] {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    color: #f8fafc;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .prob-badge {
    font-size: 0.8rem;
    color: #38bdf8;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .del-btn {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  .del-btn:hover {
    background: rgba(239, 68, 68, 0.3);
  }
  .admin-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #1e293b;
  }
  .btn-secondary {
    background: #334155;
    color: #f8fafc;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .btn-secondary:hover {
    background: #475569;
  }
  .btn-danger {
    background: rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  canvas#confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="top-controls">
  <button id="bgm-btn" class="icon-btn" title="BGM切替">🎵 BGM: OFF</button>
  <button id="sound-btn" class="icon-btn" title="効果音切替">🔊 効果音</button>
  <button id="secret-btn" class="icon-btn" title="設定">⚙</button>
</div>

<h1 id="title">LUCKY ROULETTE</h1>

<div class="wheel-wrapper">
  <div class="pointer"></div>
  <canvas id="wheel" width="600" height="600"></canvas>
  <div class="center-cap"></div>
</div>

<button id="spin-btn">スタート / SPIN</button>

<!-- Result Modal -->
<div id="result-modal" class="modal-backdrop">
  <div class="result-card">
    <div class="result-label">RESULT</div>
    <div id="result-text" class="result-value">---</div>
    <button id="close-result-btn" class="btn-primary">OK</button>
  </div>
</div>

<!-- Secret Admin Modal -->
<div id="admin-modal" class="modal-backdrop">
  <div class="admin-card">
    <div class="admin-header">
      <h2>🔒 裏確率・項目設定（運営専用）</h2>
      <button id="close-admin-btn" class="btn-secondary">閉じる</button>
    </div>
    <p class="admin-note">
      盤面の見た目はすべて均等角度で描画されますが、実際の抽選は右側の「重み」の比率で行われます（プレイヤー画面には確率は表示されません）。
    </p>
    <div id="items-container"></div>
    <div class="admin-actions">
      <div>
        <button id="add-item-btn" class="btn-secondary">＋ 項目を追加</button>
        <button id="reset-btn" class="btn-danger">初期データに戻す</button>
      </div>
      <button id="save-admin-btn" class="btn-primary">保存して閉じる</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const STORAGE_KEY = "secret_roulette_items_v2";

  // ハズレなし・景品名なし・1等/2等はかなり低確率
  const DEFAULT_ITEMS = [
    { label: "1等", color: "#ef4444", weight: 1 },
    { label: "2等", color: "#f59e0b", weight: 3 },
    { label: "3等", color: "#10b981", weight: 25 },
    { label: "4等", color: "#3b82f6", weight: 71 }
  ];

  let items = loadItems();
  let currentRotation = 0;
  let isSpinning = false;
  let soundEnabled = true;
  let bgmPlaying = false;
  let bgmTimer = null;
  let bgmStep = 0;
  let titleClickCount = 0;
  let titleClickTimer = null;

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spin-btn");
  const bgmBtn = document.getElementById("bgm-btn");
  const soundBtn = document.getElementById("sound-btn");
  const secretBtn = document.getElementById("secret-btn");
  const titleEl = document.getElementById("title");

  const resultModal = document.getElementById("result-modal");
  const resultText = document.getElementById("result-text");
  const closeResultBtn = document.getElementById("close-result-btn");

  const adminModal = document.getElementById("admin-modal");
  const itemsContainer = document.getElementById("items-container");
  const addItemBtn = document.getElementById("add-item-btn");
  const resetBtn = document.getElementById("reset-btn");
  const saveAdminBtn = document.getElementById("save-admin-btn");
  const closeAdminBtn = document.getElementById("close-admin-btn");

  // Web Audio API
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // 楽しく弾むチップチューン風ループBGM
  const MELODY_NOTES = [
    523.25, 659.25, 783.99, 1046.50,
    880.00, 1046.50, 783.99, 659.25,
    587.33, 698.46, 880.00, 987.77,
    1046.50, 783.99, 659.25, 523.25,
    659.25, 783.99, 880.00, 1046.50,
    1174.66, 1046.50, 880.00, 783.99,
    698.46, 880.00, 783.99, 659.25,
    587.33, 659.25, 523.25, 0
  ];

  const BASS_NOTES = [
    261.63, 0, 196.00, 0,
    261.63, 0, 196.00, 0,
    293.66, 0, 220.00, 0,
    261.63, 0, 196.00, 0,
    261.63, 0, 196.00, 0,
    349.23, 0, 261.63, 0,
    293.66, 0, 196.00, 0,
    261.63, 196.00, 261.63, 0
  ];

  function playBgmStep() {
    if (!bgmPlaying) return;
    const ac = getAudioCtx();
    if (!ac) return;

    const now = ac.currentTime;
    const idx = bgmStep % MELODY_NOTES.length;
    // ルーレット回転中は少しテンポアップしてワクワク感を演出
    const tempoMs = isSpinning ? 130 : 185;
    const noteDur = (tempoMs / 1000) * 0.85;

    const melFreq = MELODY_NOTES[idx];
    if (melFreq > 0) {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(melFreq, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + noteDur);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(now);
      osc.stop(now + noteDur);
    }

    const bassFreq = BASS_NOTES[idx];
    if (bassFreq > 0) {
      const oscB = ac.createOscillator();
      const gainB = ac.createGain();
      oscB.type = "sine";
      oscB.frequency.setValueAtTime(bassFreq, now);
      gainB.gain.setValueAtTime(0.11, now);
      gainB.gain.exponentialRampToValueAtTime(0.001, now + noteDur * 1.1);
      oscB.connect(gainB);
      gainB.connect(ac.destination);
      oscB.start(now);
      oscB.stop(now + noteDur * 1.15);
    }

    bgmStep++;
    bgmTimer = setTimeout(playBgmStep, tempoMs);
  }

  function startBgm() {
    if (bgmPlaying) return;
    bgmPlaying = true;
    bgmBtn.textContent = "🎵 BGM: ON";
    bgmBtn.style.borderColor = "#f59e0b";
    bgmBtn.style.color = "#fde047";
    getAudioCtx();
    playBgmStep();
  }

  function stopBgm() {
    bgmPlaying = false;
    clearTimeout(bgmTimer);
    bgmBtn.textContent = "🎵 BGM: OFF";
    bgmBtn.style.borderColor = "rgba(255, 255, 255, 0.15)";
    bgmBtn.style.color = "#cbd5e1";
  }

  function playTick() {
    if (!soundEnabled) return;
    const ac = getAudioCtx();
    if (!ac) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(660, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ac.currentTime + 0.04);
    gain.gain.setValueAtTime(0.14, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + 0.045);
  }

  function playWin() {
    if (!soundEnabled) return;
    const ac = getAudioCtx();
    if (!ac) return;
    // 明るく華やかなファンファーレ和音
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
    notes.forEach((freq, idx) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "triangle";
      const startTime = ac.currentTime + idx * 0.08;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.2, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.46);
    });
  }

  function loadItems() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length >= 2) return parsed;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  }

  function saveItems(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function drawWheel() {
    const num = items.length;
    const arc = (Math.PI * 2) / num;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = cx - 8;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < num; i++) {
      const startAngle = currentRotation + i * arc - Math.PI / 2;
      const endAngle = startAngle + arc;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = items[i].color || "#3b82f6";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(startAngle + arc / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 30px sans-serif";
      ctx.shadowColor = "rgba(0,0,0,0.6)";
      ctx.shadowBlur = 4;
      const label = items[i].label || "";
      const displayLabel = label.length > 10 ? label.slice(0, 9) + "…" : label;
      ctx.fillText(displayLabel, radius - 34, 10);
      ctx.restore();
    }
  }

  function pickWeightedIndex() {
    const weights = items.map(item => Math.max(0, Number(item.weight) || 0));
    const totalWeight = weights.reduce((a, b) => a + b, 0);
    if (totalWeight <= 0) {
      return Math.floor(Math.random() * items.length);
    }
    let rand = Math.random() * totalWeight;
    for (let i = 0; i < weights.length; i++) {
      if (rand < weights[i]) return i;
      rand -= weights[i];
    }
    return weights.length - 1;
  }

  let hasAutoStartedBgm = false;

  function spin() {
    if (isSpinning || items.length < 2) return;
    isSpinning = true;
    spinBtn.disabled = true;
    getAudioCtx();

    // 初回スタート操作時にBGMを自動再生（ユーザーが手動でOFFにしていない場合）
    if (!hasAutoStartedBgm && !bgmPlaying) {
      hasAutoStartedBgm = true;
      startBgm();
    }

    const targetIndex = pickWeightedIndex();
    const num = items.length;
    const arc = (Math.PI * 2) / num;

    const sliceOffset = (0.15 + Math.random() * 0.7) * arc;
    const desiredMod = ((Math.PI * 2) - ((targetIndex * arc + sliceOffset) % (Math.PI * 2))) % (Math.PI * 2);
    const currentMod = ((currentRotation % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);
    let delta = desiredMod - currentMod;
    if (delta < 0) delta += Math.PI * 2;

    const extraSpins = (6 + Math.floor(Math.random() * 3)) * Math.PI * 2;
    const totalDelta = extraSpins + delta;
    const startRotation = currentRotation;
    const duration = 4500;
    const startTime = performance.now();
    let lastTickSector = Math.floor(startRotation / arc);

    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - t, 4);
      currentRotation = startRotation + totalDelta * ease;

      const currentSector = Math.floor(currentRotation / arc);
      if (currentSector !== lastTickSector) {
        playTick();
        lastTickSector = currentSector;
      }

      drawWheel();

      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        spinBtn.disabled = false;
        showResult(items[targetIndex].label);
      }
    }

    requestAnimationFrame(animate);
  }

  function showResult(label) {
    resultText.textContent = label;
    resultModal.classList.add("active");
    playWin();
    launchConfetti();
  }

  // Confetti
  const confettiCanvas = document.getElementById("confetti");
  const cCtx = confettiCanvas.getContext("2d");
  let particles = [];
  function launchConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
    const colors = ["#fde047", "#ef4444", "#3b82f6", "#10b981", "#a855f7", "#f97316"];
    particles = Array.from({ length: 90 }, () => ({
      x: confettiCanvas.width / 2,
      y: confettiCanvas.height / 2,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 0.7) * 16,
      size: 6 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 12,
      alpha: 1
    }));
    requestAnimationFrame(updateConfetti);
  }

  function updateConfetti() {
    cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;
      p.rot += p.vRot;
      p.alpha -= 0.012;
      if (p.alpha > 0) {
        alive = true;
        cCtx.save();
        cCtx.globalAlpha = p.alpha;
        cCtx.translate(p.x, p.y);
        cCtx.rotate((p.rot * Math.PI) / 180);
        cCtx.fillStyle = p.color;
        cCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        cCtx.restore();
      }
    });
    if (alive) requestAnimationFrame(updateConfetti);
  }

  // Admin Modal Logic
  let draftItems = [];

  function openAdmin() {
    if (isSpinning) return;
    draftItems = JSON.parse(JSON.stringify(items));
    renderAdminItems();
    adminModal.classList.add("active");
  }

  function renderAdminItems() {
    itemsContainer.innerHTML = "";
    const totalWeight = draftItems.reduce((sum, it) => sum + Math.max(0, Number(it.weight) || 0), 0);

    draftItems.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "item-row";

      const colorInput = document.createElement("input");
      colorInput.type = "color";
      colorInput.value = item.color || "#3b82f6";
      colorInput.addEventListener("input", e => {
        draftItems[idx].color = e.target.value;
      });

      const labelInput = document.createElement("input");
      labelInput.type = "text";
      labelInput.value = item.label;
      labelInput.placeholder = "項目名";
      labelInput.addEventListener("input", e => {
        draftItems[idx].label = e.target.value;
      });

      const weightInput = document.createElement("input");
      weightInput.type = "number";
      weightInput.min = "0";
      weightInput.step = "1";
      weightInput.value = item.weight;
      weightInput.title = "重み（当選比率）";
      weightInput.addEventListener("input", e => {
        draftItems[idx].weight = Math.max(0, Number(e.target.value) || 0);
        updateProbLabels();
      });

      const probSpan = document.createElement("span");
      probSpan.className = "prob-badge";
      const pct = totalWeight > 0 ? ((Math.max(0, Number(item.weight) || 0) / totalWeight) * 100).toFixed(1) : "0.0";
      probSpan.textContent = pct + "%";

      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "×";
      delBtn.title = "削除";
      delBtn.disabled = draftItems.length <= 2;
      delBtn.addEventListener("click", () => {
        if (draftItems.length > 2) {
          draftItems.splice(idx, 1);
          renderAdminItems();
        }
      });

      row.append(colorInput, labelInput, weightInput, probSpan, delBtn);
      itemsContainer.appendChild(row);
    });
  }

  function updateProbLabels() {
    const totalWeight = draftItems.reduce((sum, it) => sum + Math.max(0, Number(it.weight) || 0), 0);
    const badges = itemsContainer.querySelectorAll(".prob-badge");
    draftItems.forEach((item, idx) => {
      if (badges[idx]) {
        const pct = totalWeight > 0 ? ((Math.max(0, Number(item.weight) || 0) / totalWeight) * 100).toFixed(1) : "0.0";
        badges[idx].textContent = pct + "%";
      }
    });
  }

  // Event Listeners
  spinBtn.addEventListener("click", spin);
  closeResultBtn.addEventListener("click", () => resultModal.classList.remove("active"));
  resultModal.addEventListener("click", e => {
    if (e.target === resultModal) resultModal.classList.remove("active");
  });

  bgmBtn.addEventListener("click", () => {
    hasAutoStartedBgm = true;
    if (bgmPlaying) {
      stopBgm();
    } else {
      startBgm();
    }
  });

  soundBtn.addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? "🔊 効果音" : "🔇 ミュート";
  });

  secretBtn.addEventListener("click", openAdmin);

  titleEl.addEventListener("click", () => {
    titleClickCount++;
    clearTimeout(titleClickTimer);
    if (titleClickCount >= 3) {
      titleClickCount = 0;
      openAdmin();
    } else {
      titleClickTimer = setTimeout(() => {
        titleClickCount = 0;
      }, 800);
    }
  });

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "s" || e.key === "S") {
      if (adminModal.classList.contains("active")) {
        adminModal.classList.remove("active");
      } else {
        openAdmin();
      }
    }
  });

  addItemBtn.addEventListener("click", () => {
    const palette = ["#8b5cf6", "#ec4899", "#14b8a6", "#f97316", "#6366f1", "#84cc16"];
    const color = palette[draftItems.length % palette.length];
    draftItems.push({ label: `${draftItems.length + 1}等`, color, weight: 10 });
    renderAdminItems();
  });

  resetBtn.addEventListener("click", () => {
    draftItems = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    renderAdminItems();
  });

  saveAdminBtn.addEventListener("click", () => {
    items = draftItems.map(it => ({
      label: it.label.trim() || "名称未設定",
      color: it.color || "#3b82f6",
      weight: Math.max(0, Number(it.weight) || 0)
    }));
    saveItems(items);
    drawWheel();
    adminModal.classList.remove("active");
  });

  closeAdminBtn.addEventListener("click", () => {
    adminModal.classList.remove("active");
  });

  drawWheel();
});
</script>
</body>
</html>
